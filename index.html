
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eBook Store</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f7f5f0; color: #202020; }
    header { padding: 24px 8%; background: white; display: flex; justify-content: space-between; }
    main { max-width: 900px; margin: 70px auto; padding: 20px; text-align: center; }
    h1 { font-size: 42px; }
    p { color: #666; line-height: 1.7; }
    .book { background: white; padding: 30px; margin: 30px auto; border-radius: 16px; max-width: 320px; }
    button { background: #202020; color: white; padding: 14px 22px; border: 0; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <header><strong>eBook Store</strong><span>Digital Books</span></header>
  <main>
    <h1>Ideas Worth Reading.</h1>
    <p>Discover digital books to learn, grow and think differently.</p>
    <div class="book">
      <h2>Your First eBook</h2>
      <p>Add your book description and price here.</p>
      <button onclick="alert('Add your verified checkout link before selling.')">Explore eBook</button>
    </div>
  </main>
</body>
</html>
